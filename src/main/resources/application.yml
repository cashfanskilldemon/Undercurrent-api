server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: undercurrent-api
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接信息全部走环境变量，仓库里不留任何凭据。
    # 本地开发可二选一：① 设 DB_URL / DB_USERNAME / DB_PASSWORD 环境变量；
    # ② 复制 config/application.yml.example 为 config/application.yml 填真实值（已被 .gitignore 忽略，
    #    外置 config/ 目录优先级高于 classpath，会覆盖这里的默认值）。
    url: "${DB_URL:jdbc:mysql://localhost:3306/Undercurrent_test?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&connectTimeout=5000&socketTimeout=30000}"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.undercurrent.domain
  configuration:
    map-underscore-to-camel-case: true          # create_at -> createAt
    default-fetch-size: 100
    default-statement-timeout: 30

logging:
  level:
    com.undercurrent.mapper: debug              # 打印 SQL，上线可改 info

app:
  auth:
    # 生产环境务必用 AUTH_SECRET 环境变量覆盖；改了密钥所有已签发 token 立即失效
    secret: ${AUTH_SECRET:undercurrent-dev-secret-change-me}
    # token 有效期（秒），默认 7 天
    ttl-seconds: ${AUTH_TTL_SECONDS:604800}
    # 是否继续信任手写的 X-User-Id 请求头（仅本地联调用，默认关闭）
    allow-header-fallback: ${AUTH_ALLOW_HEADER_FALLBACK:false}
    # 防爆破：同一账号连续失败 5 次锁定 10 分钟（30 分钟没有新失败则重新计数）
    login-max-attempts: ${AUTH_LOGIN_MAX_ATTEMPTS:5}
    login-lock-minutes: ${AUTH_LOGIN_LOCK_MINUTES:10}
    login-fail-window-minutes: ${AUTH_LOGIN_FAIL_WINDOW_MINUTES:30}
  email:
    # dev：验证码不打真实邮件，只打后端日志；改成 smtp 后走下面的 SMTP 配置
    provider: ${EMAIL_PROVIDER:dev}
    from: "${EMAIL_FROM:UNDERCURRENT <no-reply@undercurrent.local>}"
    app-name: UNDERCURRENT
  sms:
    # dev：验证码只打后端日志；留给后续手机号实名认证
    provider: ${SMS_PROVIDER:dev}
  code:
    # dev 环境把验证码回传给前端方便联调，**上线必须关掉**
    expose-code: ${CODE_EXPOSE_CODE:true}
    ttl-minutes: 5
    resend-seconds: 60
    daily-limit: 10
    max-verify-attempts: 5
  # 仅在 email.provider=smtp 时生效（QQ / 163 要用授权码，不是登录密码）
  mail:
    host: ${EMAIL_SMTP_HOST:smtp.qq.com}
    port: ${EMAIL_SMTP_PORT:465}
    username: ${EMAIL_SMTP_USERNAME:}
    password: ${EMAIL_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.socketFactory.class: javax.net.ssl.SSLSocketFactory
